[package]
name = "ai-trading-agent"
version = "0.1.0"
edition = "2021"
authors = ["AI Trading Agent Contributors"]
description = "High-performance AI Trading Agent with event-driven architecture"
license = "MIT"
repository = "https://github.com/ForgeTrade/ai-trading-agent"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rust_decimal = { version = "1.35", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dashmap = "6.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.23"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tokio-test = "0.4"
